<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7f4">
    <title>Framecraft — Loading</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="loading-screen" aria-label="Framecraft">
      <div class="composition">
        <div class="wordmark">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span>Framecraft</span>
        </div>
        <div class="loading-state" role="status" aria-live="polite" aria-atomic="true">
          <div class="indicator" aria-hidden="true"><span></span></div>
          <h1>Loading…</h1>
          <p>A little space for your next idea.<br>Your workspace is on its way.</p>
        </div>
        <div class="signature" aria-hidden="true"><span></span> Made for what’s next <span></span></div>
      </div>
    </main>
  </body>
</html>
