name: Publish studio to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # The export smoke test requires native AAC encoding, available in macOS Chromium.
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: node packages/studio/build/portable.mjs
      - run: node scripts/check-portable.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/monaco-portable-smoke.mjs
      - run: pnpm test:react18
      - name: Inspect npm contents
        working-directory: packages/studio/portable
        run: npm pack --dry-run
      - name: Publish to npm using trusted publishing
        if: github.event_name == 'release'
        working-directory: packages/studio/portable
        run: npm publish --access public --provenance
